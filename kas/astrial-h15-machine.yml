header:
  version: 11

# kas costruisce un ambiente controllato e scarta le variabili della shell che non sono
# dichiarate qui. Il valore indicato e' il difetto: se la shell esporta la variabile, vince
# quello della shell. Senza questa sezione, SYSELE_SBOM e SYSELE_BSP_VERSION non arrivano
# a bitbake, e un INHERIT condizionato al loro valore non scatta mai, in silenzio.
env:
  SYSELE_SBOM: "none"
  SYSELE_BSP_VERSION: "unreleased"

machine: astrial-h15

local_conf_header:
  astrial_config: |
    # Astrial H15 specific configuration
    DISTRO_FEATURES:append = " hailo-dev-pkg"
    
    # Camera configuration for IMX334
    MACHINE_FEATURES:append = " imx334"
    MACHINE_FEATURES:remove = " imx678"

  sbom: |
    # Distinta dei componenti (SBOM) e controllo CVE. Tre livelli, scelti dal workflow
    # con la variabile d'ambiente SYSELE_SBOM. Senza la variabile vale "none", quindi
    # una build che non la passa si comporta esattamente come prima.
    #
    #   none      niente. E' il valore di partenza.
    #   standard  SPDX della distinta piu' cve-check. E' il livello delle build di tag.
    #   full      in piu' archivia i file dei pacchetti, da cui i checksum. Pesa molto
    #             di piu', si accende su richiesta di un cliente che li pretende.
    #
    # Nota su cosa NON e' qui: gli externalRefs (CPE e purl), cioe' le chiavi con cui un
    # analizzatore trova i CVE, non sono un interruttore. Si ottengono dichiarando
    # CVE_PRODUCT nelle singole ricette, una per una.
    SYSELE_SBOM ??= "none"

    INHERIT += "${@bb.utils.contains_any('SYSELE_SBOM', 'standard full', 'create-spdx cve-check', '', d)}"
    SPDX_PRETTY = "1"
    SPDX_ARCHIVE_PACKAGED = "${@bb.utils.contains('SYSELE_SBOM', 'full', '1', '0', d)}"

    # Il report tiene anche i CVE gia' chiusi da una patch: sono l'informazione che fa
    # sgonfiare i falsi positivi a valle, perche' un analizzatore che guarda solo nome e
    # versione li segnala comunque come aperti.
    CVE_CHECK_REPORT_PATCHED = "1"

    # Niente avvisi in console. cve-check ne stampa uno per ricetta con TUTTI i CVE non
    # corretti concatenati su una riga sola (cve-check.bbclass riga 466): per il kernel
    # sono oltre 21000 identificatori, e una riga cosi' lunga fa morire kas, che legge
    # l'output di bitbake con uno stream asyncio che ha un limite di riga:
    #   asyncio.exceptions.LimitOverrunError: Separator is found, but chunk is longer than limit
    # Bitbake finisce bene, e' kas a cadere. Il JSON, che e' quello che usiamo, viene
    # scritto lo stesso.
    CVE_CHECK_SHOW_WARNINGS = "0"

  bsp_version: |
    # Readable BSP version shown on the board by sysele-info. The CI exports
    # SYSELE_BSP_VERSION on a tagged build; a local build honestly says "unreleased".
    SYSELE_BSP_VERSION ??= "unreleased"

  wget_workaround: |
    # Workaround for fetch failures with wget's default user-agent.
    FETCHCMD_wget = "/usr/bin/env wget -t 2 -T 30 --passive-ftp --user-agent='bitbake/2.0'"

  astrial_wic: |
    # Keep WIC generation only for the customer-facing development image.
    # Do not enable it globally, as hailo-update-image also builds swupdate-image.
    IMAGE_FSTYPES:append:pn-core-image-hailo-dev = " wic"
    WKS_FILE:pn-core-image-hailo-dev = "sd.wks.in"
    SD_FIXED_SIZE:pn-core-image-hailo-dev = "32"
    WKS_FILE_DEPENDS:append:pn-core-image-hailo-dev = " linux-yocto-hailo ${@bb.utils.contains("MACHINE_FEATURES", "falcon_mode", "", "u-boot-tfa-image", d)}"

repos:
  meta-sysele-bsp:
    path: ./meta-sysele-bsp
  poky:
    refspec: yocto-4.0.35

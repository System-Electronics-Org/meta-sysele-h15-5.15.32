header:
  version: 11

machine: astrial-h15

local_conf_header:
  astrial_config: |
    # Astrial H15 specific configuration
    DISTRO_FEATURES:append = " hailo-dev-pkg"
    
    # Camera configuration for IMX334
    MACHINE_FEATURES:append = " imx334"
    MACHINE_FEATURES:remove = " imx678"

  sbom: |
    # SPDX SBOM for the image. Measurement branch: this is on unconditionally here, to find
    # out what it costs in build time and in output size before deciding where it belongs.
    # poky 4.0.35 emits SPDX 2.2 and already combines the per-recipe documents at rootfs time
    # into <image>.spdx.tar.zst plus an .spdx.index.json, so no merging script is needed.
    INHERIT += "create-spdx"
    SPDX_PRETTY = "1"

    # do_create_spdx reads the licence texts along LICENSE_PATH, but LICENSE_PATH is not part of
    # the task signature, so adding a licence text does not invalidate the cached result. That
    # matters because a licence it cannot find is reported with bb.error, which only logs: the
    # task still finishes, still writes a document with "extractedText": null, and still goes
    # into sstate. Every later build then restores that empty document and reports no error at
    # all, so a pipeline with a warm cache publishes a silently incomplete SBOM.
    do_create_spdx[vardeps] += "LICENSE_PATH"

  bsp_version: |
    # Readable BSP version shown on the board by sysele-info. The CI exports
    # SYSELE_BSP_VERSION on a tagged build; a local build honestly says "unreleased".
    SYSELE_BSP_VERSION ?= "${@os.environ.get('SYSELE_BSP_VERSION', 'unreleased')}"

  wget_workaround: |
    # Workaround for fetch failures with wget's default user-agent.
    FETCHCMD_wget = "/usr/bin/env wget -t 2 -T 30 --passive-ftp --user-agent='bitbake/2.0'"

  astrial_wic: |
    # Keep WIC generation only for the customer-facing development image.
    # Do not enable it globally, as hailo-update-image also builds swupdate-image.
    IMAGE_FSTYPES:append:pn-core-image-hailo-dev = " wic"
    WKS_FILE:pn-core-image-hailo-dev = "sd.wks.in"
    SD_FIXED_SIZE:pn-core-image-hailo-dev = "32"
    WKS_FILE_DEPENDS:append:pn-core-image-hailo-dev = " linux-yocto-hailo ${@bb.utils.contains("MACHINE_FEATURES", "falcon_mode", "", "u-boot-tfa-image", d)}"

repos:
  meta-sysele-bsp:
    path: ./meta-sysele-bsp
  poky:
    refspec: yocto-4.0.35

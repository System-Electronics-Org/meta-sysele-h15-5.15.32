name: Astrial H15 Dev Build (cached)

run-name: Astrial H15 Dev Build • ${{ inputs.ref || github.ref_name }}

# Build di sviluppo economica: usa la GitHub Actions Cache (sstate + downloads)
# per ricompilare solo il delta (~90 min -> ~15-20 min). NON pubblica tag/release,
# lascia solo gli artifact effimeri del run. Trigger manuale per controllo sui costi.
#
# Per compilare un branch sperimentale, lancia il dispatch DA master e scrivi il
# branch in `ref`. La cache di GitHub e' leggibile solo dal branch che l'ha creata
# e dal branch di default: partendo da master tutti i branch sperimentali
# condividono una cache sola invece di scaldarsene una a testa. Le build ufficiali
# girano con use_cache=false, quindi non leggono nulla di quella cache.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch o commit da compilare. Vuoto = il branch da cui lanci."
        type: string
        required: false
        default: ''

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      publish: false
      use_cache: true
      ref: ${{ inputs.ref }}
    secrets: inherit

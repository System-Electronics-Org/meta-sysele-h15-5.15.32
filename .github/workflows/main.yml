name: Astrial H15 Yocto Build and Release

run-name: Astrial H15 Build • ${{ github.ref_name }} • ${{ github.event_name }}

# Build ufficiali (comportamento identico a prima del refactor):
# no-cache, validazione end-to-end + pubblicazione tag/prerelease.
# Lo schedulato bisettimanale è la validazione from-scratch voluta (Filippini).
on:
  workflow_dispatch:
  push:
    branches:
      # kirkstone e' il nome verso cui andiamo; master resta finche' la rinomina non e'
      # fatta, cosi' il passaggio non spegne la CI.
      - kirkstone
      - master
  schedule:
    # Canarino: dice se master compila ancora. Non pubblica nulla di permanente.
    - cron: '0 2 */14 * *'  # Every 2 weeks at 2 AM UTC (only on default branch)

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    with:
      release: continuous
      use_cache: false
    secrets: inherit

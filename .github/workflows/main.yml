name: Astrial H15 Yocto Build and Release

run-name: Astrial H15 Build • ${{ github.ref_name }} • ${{ github.event_name }}

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: '0 2 */14 * *'  # Every 2 weeks at 2 AM UTC (only on default branch)
    
jobs:
  build:
    runs-on: ubuntu-large-runner
    permissions:
      contents: write
    steps:
      - name: Install Dependencies
        run: |
          # Configure environment
          echo "BB_ISOLATE_NETWORK=0" >> $GITHUB_ENV
          echo "BB_NO_NETWORK=0" >> $GITHUB_ENV
          
          # Install required packages for Yocto build
          sudo apt-get update
          sudo apt-get install -y gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect xz-utils debianutils \
            iputils-ping python3-git python3-jinja2 libegl1 libsdl1.2-dev \
            python3-subunit mesa-common-dev zstd liblz4-tool file locales libacl1 \
            curl python-is-python3 bmap-tools u-boot-tools
          sudo locale-gen en_US.UTF-8
          
          # Install KAS
          sudo pip3 install "kas==5.3"
          kas --version

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: meta-sysele-bsp

      - name: Setup Build Environment
        run: |
          # Clone the official Hailo 1.12 repository
          git clone --branch 1.12.0 --single-branch \
            https://github.com/hailo-ai/meta-hailo-soc.git
          cd meta-hailo-soc
          
          # Copy the checked out meta-sysele-bsp into the correct location
          cp -r ../meta-sysele-bsp ./meta-sysele-bsp

          cat > astrial-h15-ci.yml <<'EOF'
          header:
            version: 11
            includes:
              - kas/yocto-base.yml
              - meta-sysele-bsp/kas/astrial-h15-vpu-base.yml
              - kas/targets/hailo-soc-target-core-image-hailo-dev.yml
              - meta-sysele-bsp/kas/astrial-h15-machine.yml
          
          build_system: openembedded
          EOF
          
          # Create secure boot keypair from GitHub secret (with security measures)
          if [ "${{ secrets.HAILO_CUSTOMER_KEYPAIR }}" != "" ]; then
            # Create keypair file with restricted permissions
            echo "${{ secrets.HAILO_CUSTOMER_KEYPAIR }}" > meta-sysele-bsp/recipes-bsp/hailo-secureboot-assets/files/customer_keypair.pem
            chmod 600 meta-sysele-bsp/recipes-bsp/hailo-secureboot-assets/files/customer_keypair.pem
            echo "Secure boot keypair created from secret"
          else
            echo "Warning: HAILO_CUSTOMER_KEYPAIR secret not found - secure boot will be disabled"
            # Create empty file to prevent build errors
            touch meta-sysele-bsp/recipes-bsp/hailo-secureboot-assets/files/customer_keypair.pem
          fi
          
          # Initialize submodules
          git submodule update --init --recursive

      - name: Create Patch for BitBake Network Isolation
        run: |
          cd meta-hailo-soc
          
          # Find the BitBake worker script path
          BB_WORKER=$(find . -name "bitbake-worker" -type f | head -n 1)
          if [ -n "$BB_WORKER" ]; then
            echo "Found BitBake worker at $BB_WORKER"
            # Backup the original file
            cp "$BB_WORKER" "$BB_WORKER.orig"
            # Patch the file to disable network isolation
            sed -i 's/bb.utils.disable_network(uid, gid)/# Network isolation disabled for CI build/' "$BB_WORKER"
            echo "Patched BitBake worker successfully"
          else
            echo "Warning: Could not find BitBake worker script"
          fi
          
          # Find the BitBake utils.py file
          BB_UTILS=$(find . -name "utils.py" -path "*/bitbake/lib/bb/*" -type f | head -n 1)
          if [ -n "$BB_UTILS" ]; then
            echo "Found BitBake utils.py at $BB_UTILS"
            # Backup the original file
            cp "$BB_UTILS" "$BB_UTILS.orig"
            # Patch the file to disable network isolation
            sed -i 's/def disable_network(uid, gid):/def disable_network(uid, gid):\n    return  # Function disabled for CI build/' "$BB_UTILS"
            echo "Patched BitBake utils.py successfully"
          else
            echo "Warning: Could not find BitBake utils.py"
          fi

      - name: Build Yocto Image with KAS
        run: |
          cd meta-hailo-soc
          
          # --- limiti di sistema: pseudo apre molti fd, uno per client ---
          ulimit -n 65536 || echo "WARN: impossibile alzare il limite fd"
          echo "fd limit: $(ulimit -n) | cpu: $(nproc) | tar: $(tar --version | head -1)"

          # Set environment variables for network isolation
          export BB_ISOLATE_NETWORK=0
          export BB_NO_NETWORK=0
          
          # --- tetto ai task concorrenti ---
          export BB_NUMBER_THREADS=16
          export PARALLEL_MAKE="-j 16"
          
          # CI-specific build optimizations - reduce log verbosity
          export BITBAKE_UI_OPTS="-k"
          export BB_LOGCONFIG=""
          export BB_CONSOLELOG=""
          export BB_DEFAULT_TASK="build"
          export GITHUB_ACTIONS_BUILD=1  # Flag to detect CI environment
          
          export BB_ENV_PASSTHROUGH_ADDITIONS="GITHUB_SHA GITHUB_REPOSITORY GITHUB_RUN_ID BB_ISOLATE_NETWORK BB_NO_NETWORK BITBAKE_UI_OPTS BB_LOGCONFIG BB_CONSOLELOG BB_DEFAULT_TASK GITHUB_ACTIONS_BUILD"
          
          # Build using KAS with our Astrial H15 configuration
          set -e  # Exit on any error
          if ! kas build astrial-h15-ci.yml -- -k; then
            echo "ERROR: KAS build failed"
            exit 1
          fi

      - name: Collect Failed Task Logs        
        if: failure()
        run: |
          set +e
          BUILD=meta-hailo-soc/build
          mkdir -p failure-logs

          echo "===== ultime 200 righe del cooker log ====="
          COOKER=$(ls -t "$BUILD"/tmp/log/cooker/*/console-latest.log 2>/dev/null | head -1)
          [ -n "$COOKER" ] && tail -n 200 "$COOKER" || echo "(nessun cooker log)"

          echo "===== spazio disco / memoria ====="
          df -h; free -h

          # 1) path dichiarati da bitbake
          find "$BUILD/tmp/log" -name '*.log' -exec \
            grep -h "Logfile of failure stored in:" {} + 2>/dev/null \
            | sed 's/.*stored in: //' | tr -d '\r' | sort -u > /tmp/failed.txt

          # 2) fallback: solo i log.do_* che contengono un errore VERO
          if [ ! -s /tmp/failed.txt ]; then
            echo "Nessun 'Logfile of failure': cerco log.do_* con errori"
            find "$BUILD/tmp/work" -path '*/temp/log.do_*' -newermt '-6 hours' -print0 \
              | xargs -0 -r grep -lE '^(ERROR|FATAL):|Error [0-9]+$|\*\*\* \[' \
              | sort -u > /tmp/failed.txt
          fi

          echo "===== log individuati ====="
          cat /tmp/failed.txt

          while read -r f; do
            [ -f "$f" ] || continue
            name=$(printf '%s' "$f" | sed 's|.*/tmp/work/||; s|/|_|g')
            cp "$f" "failure-logs/$name"
            run="${f/log.do_/run.do_}"
            [ -f "$run" ] && cp "$run" "failure-logs/${name/log.do_/run.do_}"
          done < /tmp/failed.txt

          grep -rlE "PRIVATE KEY|BEGIN .*KEY" failure-logs/ 2>/dev/null | xargs -r rm -f

          echo "===== raccolti ====="
          ls -la failure-logs/
          for f in failure-logs/*log.do_*; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            tail -n 120 "$f"
          done
          
          echo "===== ambiente ====="
          nproc; ulimit -n; ulimit -u; tar --version | head -1

          echo "===== pseudo.log ====="
          find "$BUILD/tmp/work" -name 'pseudo.log' -newermt '-6 hours' \
            | head -20 | while read -r p; do
              echo "----- $p -----"
              tail -n 60 "$p"
              cp "$p" "failure-logs/$(printf '%s' "$p" | sed 's|.*/tmp/work/||; s|/|_|g')"
            done

          exit 0
          
      - name: Retry Failed Packages Individually
        if: failure()
        run: |
          set +e
          cd meta-hailo-soc

          # ricava le ricette fallite dal cooker log
          COOKER=$(ls -t build/tmp/log/cooker/*/console-latest.log | head -1)
          grep -oP '^ERROR: \K[a-z0-9.+-]+(?=-[0-9][^ ]* do_package:)' "$COOKER" \
            | sort -u > /tmp/failed-recipes.txt

          echo "===== ricette da riprovare ====="
          cat /tmp/failed-recipes.txt

          PASS=0; FAIL=0
          while read -r r; do
            echo "----- retry: $r -----"
            if kas shell astrial-h15-ci.yml -c "bitbake -c package -f $r"; then
              echo "RETRY OK: $r"; PASS=$((PASS+1))
            else
              echo "RETRY KO: $r"; FAIL=$((FAIL+1))
            fi
          done < /tmp/failed-recipes.txt

          echo "===== esito: $PASS passate, $FAIL fallite ====="
          exit 0
          
      - name: Clean Sensitive Files Before Archiving
        run: |
          # Remove any private key files that might have been copied or generated during build
          find meta-hailo-soc/ -name "customer_keypair.pem" -delete || true
          find meta-hailo-soc/ -name "*.pem" -delete || true
          find meta-hailo-soc/ -name "*private*key*" -delete || true
          # Clean build logs that might contain sensitive information
          find meta-hailo-soc/build -name "*.log" -exec grep -l "PRIVATE\|SECRET\|KEY" {} \; -delete || true
          echo "Sensitive files cleaned before archiving"

      - name: Validate Release Artifacts
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY="meta-hailo-soc/build/tmp/deploy/images/astrial-h15"

          required_artifacts=(
            "core-image-hailo-dev-astrial-h15.wic"
            "hailo-update-image-astrial-h15.swu"
            "fitImage-astrial-h15.bin"
            "u-boot-initial-env-astrial-h15"
            "hailo15_uart_recovery_fw.bin"
            "hailo15_scu_bl.bin"
            "scu_bl_cfg_a.bin"
            "hailo15_scu_fw.bin"
            "u-boot.dtb.signed"
            "u-boot-spl.bin"
            "u-boot-initial-env"
            "customer_certificate.bin"
            "u-boot-tfa.itb"
          )

          echo "Validating release artifacts in ${DEPLOY}"

          for artifact in "${required_artifacts[@]}"; do
            artifact_path="${DEPLOY}/${artifact}"

            if [ ! -s "${artifact_path}" ]; then
              echo "::error file=${artifact_path}::Required release artifact is missing or empty"
              exit 1
            fi

            ls -lh "${artifact_path}"
          done

          required_scripts=(
            "meta-sysele-bsp/scripts/hailo15_spi_flash_program"
            "meta-sysele-bsp/scripts/program_spi_flash.sh"
            "meta-sysele-bsp/scripts/tftp_server.py"
            "meta-sysele-bsp/scripts/uart_boot_fw_loader"
          )

          for script in "${required_scripts[@]}"; do
            if [ ! -s "${script}" ]; then
              echo "::error file=${script}::Required release script is missing or empty"
              exit 1
            fi
          done

          echo "All required release artifacts are present."

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astrial-h15-yocto-build
          path: |
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/core-image-hailo-dev-astrial-h15.wic
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo-update-image-astrial-h15.swu
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/fitImage-astrial-h15.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-initial-env-astrial-h15
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo15_uart_recovery_fw.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo15_scu_bl.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/scu_bl_cfg_a.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/hailo15_scu_fw.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot.dtb.signed
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-spl.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-initial-env
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/customer_certificate.bin
            meta-hailo-soc/build/tmp/deploy/images/astrial-h15/u-boot-tfa.itb
            meta-sysele-bsp/scripts/
          if-no-files-found: error

      - name: Archive Build Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astrial-h15-build-logs
          path: |
            meta-hailo-soc/build/tmp/log/
            meta-hailo-soc/build/buildhistory/
            failure-logs/
          if-no-files-found: warn

      - name: Download Build Artifacts for Release
        uses: actions/download-artifact@v4
        with:
          name: astrial-h15-yocto-build
          path: ./release-files

      - name: Create Compressed Release Archive
        run: |
          cd release-files
          # Copy scripts to root level preserving executable permissions
          if [ -d "meta-sysele-bsp/scripts" ]; then
            cp -p meta-sysele-bsp/scripts/* .
            # Ensure execute permissions on all script files
            chmod +x *.sh *.py hailo15_* uart_* 2>/dev/null || true
          fi
          # Ensure execute permissions on any scripts in root
          chmod +x *.sh *.py hailo15_* uart_* 2>/dev/null || true
          tar -czf ../astrial-h15-yocto-build-v1.0.0.${{ github.run_number }}.tar.gz .
          cd ..
          ls -lh astrial-h15-yocto-build-v1.0.0.${{ github.run_number }}.tar.gz

      - name: Create Release with Compressed Archive
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Release v1.0.0.${{ github.run_number }}
          body: |
            **Build Information:**
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Build Date: ${{ github.event.head_commit.timestamp }}
            
            **Download and extract astrial-h15-yocto-build-v1.0.0.${{ github.run_number }}.tar.gz to get:**
            - `core-image-hailo-dev-astrial-h15.wic`: Complete SD card image for initial provisioning or recovery
            - `hailo-update-image-astrial-h15.swu`: SWUpdate package for updating an already running device
            - `fitImage-astrial-h15.bin`: Kernel and device tree
            - `hailo15_uart_recovery_fw.bin`: UART recovery firmware
            - `hailo15_scu_bl.bin`: SCU bootloader
            - `scu_bl_cfg_a.bin`: SCU bootloader configuration
            - `hailo15_scu_fw.bin`: SCU firmware
            - `u-boot.dtb.signed`: Signed U-Boot device tree
            - `u-boot-spl.bin`: U-Boot SPL
            - `u-boot-initial-env`: U-Boot initial environment
            - `customer_certificate.bin`: Customer certificate
            - `u-boot-tfa.itb`: U-Boot TFA
          files: astrial-h15-yocto-build-v1.0.0.${{ github.run_number }}.tar.gz
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Auto-bump poky (kirkstone point-release)

# Schedulato mensile: controlla se esiste un point-release yocto-4.0.x più recente
# del pin attuale in kas/astrial-h15-machine.yml. Se sì, apre una PR di bump e la
# valida con una build end-to-end (no-cache, no-release) nello stesso run.
# NIENTE auto-merge, NIENTE push su master: merge manuale solo a validazione verde.
# Solo point-release dentro kirkstone (4.0.x). Mai attraversare il branch LTS.
on:
  schedule:
    - cron: '0 3 1 * *'   # primo del mese, 03:00 UTC (solo sul default branch)
  workflow_dispatch:

jobs:
  detect-and-open:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new_tag: ${{ steps.bump.outputs.new_tag }}
      branch: ${{ steps.bump.outputs.branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Detect newer poky tag and open bump PR
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          KAS=kas/astrial-h15-machine.yml

          # Ultimo point-release 4.0.x pubblicato su poky.
          LATEST=$(git ls-remote --tags https://git.yoctoproject.org/poky \
            | grep -oP 'yocto-4\.0\.\d+$' | sort -V | tail -1)
          # Pin attuale nel nostro kas (override sul pin di hailo).
          CURRENT=$(grep -oP 'refspec:\s*\Kyocto-4\.0\.\d+' "$KAS" | head -1)

          echo "Pin attuale: ${CURRENT:-<nessuno>} | ultimo upstream: ${LATEST:-<nessuno>}"

          if [ -z "$LATEST" ] || [ -z "$CURRENT" ]; then
            echo "::warning::Impossibile determinare i tag (LATEST='$LATEST' CURRENT='$CURRENT'). Salto."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEWEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)
          if [ "$LATEST" = "$CURRENT" ] || [ "$NEWEST" != "$LATEST" ]; then
            echo "Già aggiornato ($CURRENT). Niente da fare."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="bump/poky-${LATEST#yocto-}"   # es. bump/poky-4.0.36
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH già esistente su origin, salto (PR probabilmente già aperta)."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Aggiorna SOLO il refspec poky nel nostro kas (mai commit raw, mai altri layer).
          sed -i -E "s/refspec: *yocto-4\.0\.[0-9]+/refspec: ${LATEST}/" "$KAS"
          git diff -- "$KAS"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -am "ci: bump poky ${CURRENT} -> ${LATEST}"
          git push origin "$BRANCH"

          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "ci: bump poky to ${LATEST}" \
            --body "$(cat <<EOF
          Bump automatico del pin poky in \`${KAS}\`: **${CURRENT} → ${LATEST}** (point-release kirkstone).

          - Solo il campo \`repos: poky: refspec:\` è cambiato. \`meta-hailo\` resta a \`kirkstone_v5.3.0\`.
          - Una build di validazione end-to-end (no-cache, no-release) parte **in questo stesso run**.
          - **Non mergiare** finché non compare il commento \`✅ Bump poky ${LATEST} validato\` e la status \`poky-bump-validation\` è verde.

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )"

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "new_tag=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

  # Validazione: build identica alla release ma senza pubblicare nulla, sul branch di bump.
  # Il nuovo poky è già committato nel kas del branch, la build lo legge da sé (nessun refspec da passare).
  validate:
    needs: detect-and-open
    if: needs.detect-and-open.outputs.bumped == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      publish: false
      use_cache: false
      ref: ${{ needs.detect-and-open.outputs.branch }}
    secrets: inherit

  report:
    needs: [detect-and-open, validate]
    if: always() && needs.detect-and-open.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Report validation result on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.detect-and-open.outputs.new_tag }}
          BRANCH: ${{ needs.detect-and-open.outputs.branch }}
          RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA=$(gh pr view "$BRANCH" --json headRefOid -q .headRefOid)

          if [ "$RESULT" = "success" ]; then
            MSG="✅ Bump poky ${TAG} validato: build completata senza errori."
            STATE=success
            {
              echo "## ✅ Bump poky ${TAG} validato"
              echo "Build completata senza errori sul branch \`${BRANCH}\`. Sicuro da mergiare dopo review."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            MSG="❌ Bump poky ${TAG}: build di validazione FALLITA (${RESULT}). Non mergiare."
            STATE=failure
            {
              echo "## ❌ Bump poky ${TAG} NON validato"
              echo "Build di validazione fallita (\`${RESULT}\`) sul branch \`${BRANCH}\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "[Log del run](${RUN_URL})" >> "$GITHUB_STEP_SUMMARY"

          gh pr comment "$BRANCH" --body "${MSG} [Run](${RUN_URL})"
          gh api "repos/${{ github.repository }}/statuses/${SHA}" \
            -f state="${STATE}" \
            -f context="poky-bump-validation" \
            -f target_url="${RUN_URL}" \
            -f description="${MSG:0:130}"

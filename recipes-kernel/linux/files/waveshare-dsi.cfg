# Waveshare DSI panel. The driver comes from 0007-panel-waveshare-dsi.patch:
# it is not upstream, it only exists in the Raspberry Pi kernel fork.
# Built in rather than a module, like the Raspberry Pi panel it descends from,
# so the DSI host does not sit in deferred probe waiting for a module load.
CONFIG_DRM_PANEL_WAVESHARE_DSI=y

# Goodix GT9271 touch controller on the panel, I2C 0x14. The driver is already
# in the kernel tree; the whole touchscreen input class was simply off.
CONFIG_INPUT_TOUCHSCREEN=y
CONFIG_TOUCHSCREEN_GOODIX=m

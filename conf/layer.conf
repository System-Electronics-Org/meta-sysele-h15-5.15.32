# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-sysele-bsp"
BBFILE_PATTERN_meta-sysele-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-sysele-bsp = "10"

# The recipes this layer appends to do not all live in core:
#   meta-hailo-bsp            linux-yocto-hailo, hailo-secureboot-assets, core-image-hailo-dev
#   meta-hailo-media-library  libmedialib, libgstmedialib, expected
# Undeclared, a build without those two does not fail: the bbappends are silently ignored.
LAYERDEPENDS_meta-sysele-bsp = "core meta-hailo-bsp meta-hailo-media-library"
LAYERSERIES_COMPAT_meta-sysele-bsp = "kirkstone"

# Layer version. BitBake wants a plain integer here: it compares LAYERVERSION_<collection>
# when another layer declares a dependency with a version operator.
# This is not the readable BSP version. That one is the git tag, and it reaches the board
# through /opt/sysele/share/build-info. Bump this on every release.
LAYERVERSION_meta-sysele-bsp = "1"

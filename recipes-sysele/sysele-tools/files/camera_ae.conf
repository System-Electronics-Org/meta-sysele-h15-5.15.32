# Camera knobs for the demo. Change them here, at the stand too, without
# rebuilding anything: dsi_demo reads the file at every start.

# native  let the auto exposure of Hailo's ISP do the work.
# fixed   turn it off and write a fixed exposure, for light that does not change.
AE_MODE=native

# Only with AE_MODE=fixed. In microseconds.
AE_FIXED_US=10000

# Light flicker: 0 off, 1 = 100 Hz (50 Hz mains), 2 = 120 Hz (60 Hz mains).
# At 1 the auto exposure does NOT quantise the exposure to multiples of the
# period: it stretches the frame from 33.3 to 40 ms, which takes the stream from
# 30 to 25 fps, and in exchange it holds the banding still instead of letting it
# scroll. Turn it on if the bands are visible.
FLICKER=0

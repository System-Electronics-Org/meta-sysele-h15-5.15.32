# Manopole della camera per la demo. Si cambiano qui, anche allo stand, senza
# ricompilare niente: demo le rilegge a ogni avvio.

# native  lascia lavorare l'auto-esposizione dell'ISP di Hailo.
# fixed   la spegne e scrive un'esposizione fissa, per una luce che non cambia.
AE_MODE=native

# Solo con AE_MODE=fixed. In microsecondi.
AE_FIXED_US=10000

# Sfarfallio della luce: 0 spento, 1 = 100 Hz (rete 50 Hz), 2 = 120 Hz (rete 60 Hz).
# A 1 l'auto-esposizione NON accorcia i tempi a multipli del periodo: allunga il
# frame da 33,3 a 40 ms, cioe' porta lo stream da 30 a 25 fps, e in cambio tiene
# ferme le righe invece di farle scorrere. Si accende se le righe si vedono.
FLICKER=0
